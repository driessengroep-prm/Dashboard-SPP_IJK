name: Demo naar GitHub Pages

# Every push to main deploys the demo (fictitious data only).
# Deploy only happens when tests, privacy checks and the build all succeed.
# Pull requests run the same checks without deploying.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Privacycheck (repository)
        run: npm run privacy-check -- --repo

      - name: Build (demo)
        run: npm run build:demo
        env:
          VITE_APP_MODE: demo

      - name: Privacycheck (repository + build-output)
        run: npm run privacy-check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
